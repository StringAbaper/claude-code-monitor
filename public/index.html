<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code Monitor</title>
<style>
:root, [data-theme="dark"] {
  --bg: #0a0a0a;
  --surface: #111;
  --surface2: #161616;
  --surface-hover: #1a1a1a;
  --border: #222;
  --border-light: #333;
  --text: #e5e5e5;
  --text-muted: #888;
  --text-dim: #555;
  --green: #22c55e;
  --green-bg: rgba(34,197,94,0.08);
  --amber: #f59e0b;
  --amber-bg: rgba(245,158,11,0.07);
  --red: #ef4444;
  --red-bg: rgba(239,68,68,0.07);
  --blue: #3b82f6;
  --blue-bg: rgba(59,130,246,0.07);
  --gray: #6b7280;
  --cyan: #06b6d4;
  --purple: #8b5cf6;
  --purple-bg: rgba(139,92,246,0.07);
}
[data-theme="light"] {
  --bg: #f5f5f5;
  --surface: #fff;
  --surface2: #f0f0f0;
  --surface-hover: #eaeaea;
  --border: #ddd;
  --border-light: #ccc;
  --text: #1a1a1a;
  --text-muted: #666;
  --text-dim: #999;
  --green: #16a34a;
  --green-bg: rgba(22,163,74,0.08);
  --amber: #d97706;
  --amber-bg: rgba(217,119,6,0.07);
  --red: #dc2626;
  --red-bg: rgba(220,38,38,0.07);
  --blue: #2563eb;
  --blue-bg: rgba(37,99,235,0.07);
  --gray: #9ca3af;
  --cyan: #0891b2;
  --purple: #7c3aed;
  --purple-bg: rgba(124,58,237,0.07);
}
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --font-sans:'Inter','SF Pro Text',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
  --dur-fast:120ms;
  --dur:200ms;
  --dur-slow:340ms;
}
@font-face{
  font-family:'Inter';
  font-style:normal;
  font-weight:100 900;
  font-display:swap;
  src:url('https://rsms.me/inter/font-files/InterVariable.woff2') format('woff2');
}
html{font-family:var(--font-sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);line-height:1.5;font-feature-settings:"cv11","ss01","ss03"}
/* Smooth color transitions on theme/skin switch */
body,.sidebar,.panel,.detail,.sidebar-item,.approval-card,.burn-pill,.btn-xs,.toggle-sm,.btn-focus,.btn-remove,.btn-back,.btn-settings,.btn-logout,.machine-name,.settings-section,.setting-row,select,input,button{
  transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur-fast) var(--ease),box-shadow var(--dur) var(--ease);
}

/* ── Layout ── */
.app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ── */
.sidebar{width:300px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.logo{font-size:16px;font-weight:700;letter-spacing:-0.5px}.logo span{color:var(--purple)}
.header-right{display:flex;align-items:center;gap:8px}
.btn-theme{background:none;border:1px solid var(--border);color:var(--text-muted);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.btn-theme:hover{color:var(--text);border-color:var(--border-light)}
/* Segmented control (Day / Night, etc.) */
.seg-control{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px}
.seg-control button{background:transparent;border:none;color:var(--text-muted);font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:all var(--dur) var(--ease)}
.seg-control button:hover{color:var(--text)}
.seg-control button.active{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,0.1)}
/* Subtle entry animation for new sidebar items */
@keyframes slideIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.sidebar-item{animation:slideIn var(--dur-slow) var(--ease)}
/* Settings panel fade-in */
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.settings,.detail{animation:fadeUp var(--dur-slow) var(--ease)}
.conn-dot{width:7px;height:7px;border-radius:50%}
.conn-dot.offline{background:var(--red);box-shadow:0 0 6px var(--red);animation:pulseDot 1.5s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:0.4}}
.burn-pill{display:flex;flex-direction:column;gap:3px;padding:8px 12px;margin:10px 14px 4px;border-radius:10px;font-size:11px;background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);font-variant-numeric:tabular-nums}
.burn-pill-row{display:flex;align-items:center;gap:6px}
.burn-pill-reset{font-size:10px;color:var(--text-dim);padding-left:2px}
.burn-pill strong{color:var(--text)}
.burn-pill .burn-pct{margin-left:2px}
.burn-pill .peak-tag{margin-left:auto;font-size:9px;font-weight:700;color:var(--amber);border:1px solid var(--amber);padding:1px 4px;border-radius:3px}
.burn-pill .beta-tag{font-size:8px;font-weight:700;color:var(--purple);background:var(--purple-bg);padding:2px 5px;border-radius:3px;letter-spacing:0.6px;line-height:1}
.burn-pill strong{font-size:12px;font-weight:600;color:var(--text)}
.burn-yellow{border-color:var(--amber);background:rgba(245,158,11,.08)}
.burn-orange{border-color:#fb923c;background:rgba(251,146,60,.13);color:#fb923c}
.burn-orange strong{color:#fb923c}
.burn-red{border-color:var(--red);background:rgba(239,68,68,.18);color:var(--red);animation:burnPulse 1.5s ease-in-out infinite}
.burn-red strong{color:var(--red)}
@keyframes burnPulse{0%,100%{opacity:1}50%{opacity:.6}}
.anomaly-toast{margin:6px 12px 0;padding:8px 10px;border-radius:6px;font-size:12px;background:rgba(239,68,68,.15);border:1px solid var(--red);color:var(--red);animation:fadeIn .3s}
.anomaly-toast.sev-info{background:rgba(59,130,246,.12);border-color:var(--blue);color:var(--blue)}
.anomaly-toast.sev-warn{background:rgba(245,158,11,.13);border-color:var(--amber);color:var(--amber)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

.sidebar-toolbar{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap}
.toggle-sm{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted);cursor:pointer;user-select:none;white-space:nowrap;font-weight:500}
.toggle-sm input{accent-color:var(--purple);width:13px;height:13px;margin:0}
.toggle-sm.active{color:var(--text)}
.toggle-sm.danger{color:var(--red);font-weight:600}
.toggle-sm.danger input{accent-color:var(--red)}
.btn-xs{background:none;border:1px solid var(--border);color:var(--text-dim);font-size:10px;padding:2px 8px;border-radius:4px;cursor:pointer}
.btn-xs:hover{color:var(--text);border-color:var(--border-light)}
.btn-xs.danger{color:var(--red);border-color:rgba(239,68,68,0.3)}
.btn-xs.danger:hover{background:rgba(239,68,68,0.1);border-color:var(--red)}
.sidebar-archived-actions{display:flex;gap:8px;justify-content:center;padding:8px 16px;flex-wrap:wrap}

.sidebar-list{flex:1;overflow-y:auto;padding:10px}
.sidebar-empty{padding:40px 16px;text-align:center;color:var(--text-dim);font-size:13px}

/* Machine Group */
.machine-group{margin-bottom:10px}
.machine-header{padding:4px 6px 6px;display:flex;align-items:center;gap:6px}
.machine-name{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);cursor:pointer;border:none;background:none;padding:1px 4px;border-radius:3px;font-family:inherit}
.machine-name:hover{color:var(--text);background:var(--surface-hover)}
.machine-name:focus{outline:1px solid var(--purple);color:var(--text)}
.machine-dot{width:5px;height:5px;border-radius:50%;background:var(--text-dim);flex-shrink:0}
.machine-count{font-size:10px;color:var(--text-dim);margin-left:auto}

/* Sidebar Item — rounded card style */
.si{padding:11px 13px;margin-bottom:6px;border:1px solid var(--border);background:var(--surface);border-radius:10px;cursor:pointer;transition:all var(--dur) var(--ease);position:relative;overflow:hidden}
.si:hover{background:var(--surface-hover);border-color:var(--border-light);transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.si.selected{background:var(--purple-bg);border-color:var(--purple)}
.si.selected:hover{transform:none}
.si.has-approval{background:var(--amber-bg);border-color:var(--amber)}
.si-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.si-name{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.si-name>div:last-child{overflow:hidden;text-overflow:ellipsis}
.si-project{font-size:10px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.si-dot.working{background:var(--green);box-shadow:0 0 4px var(--green)}
.si-dot.waiting_permission{background:var(--amber);animation:blink 1.2s ease-in-out infinite}
.si-dot.idle{background:var(--blue)}
.si-dot.stopped{background:var(--gray)}
.si-badge{font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:0.3px}
.si-badge.working{color:var(--green);background:var(--green-bg)}
.si-badge.waiting_permission{color:var(--amber);background:var(--amber-bg)}
.si-badge.idle{color:var(--blue);background:var(--blue-bg)}
.si-badge.stopped{color:var(--gray);background:rgba(107,114,128,0.1)}
.si-activity{font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-meta{display:flex;gap:8px;font-size:10px;color:var(--text-dim);margin-top:2px}
.approval-badge{background:var(--amber);color:#000;font-size:9px;font-weight:700;padding:0 5px;border-radius:3px;margin-left:auto}

@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

/* ── Main Panel ── */
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.main-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:14px;text-align:center;padding:40px}
.main-empty p{max-width:300px;line-height:1.8}
.main-empty code{background:var(--surface);padding:2px 8px;border-radius:4px;font-size:12px;color:var(--purple)}

/* Approval Banner (always visible at top) */
.approval-banner{padding:12px 20px;background:var(--amber-bg);border-bottom:1px solid rgba(245,158,11,0.2)}
.ab-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--amber);font-weight:700;margin-bottom:8px}
.ab-cards{display:flex;flex-direction:column;gap:8px}
.ab-card{background:var(--surface2);border:1px solid rgba(245,158,11,0.2);border-radius:10px;padding:12px 16px}
.ab-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ab-tool{font-weight:600;color:var(--amber);font-size:13px}
.ab-project{font-size:11px;color:var(--text-muted)}
.ab-desc{font-family:'Cascadia Code','Consolas',monospace;font-size:12px;color:var(--text);padding:8px 10px;background:var(--surface2);border-radius:6px;margin-bottom:10px;word-break:break-all;line-height:1.5;max-height:80px;overflow-y:auto}
.ab-actions{display:flex;justify-content:space-between;align-items:center}
.ab-btns{display:flex;gap:8px}
.btn-allow{background:var(--green);color:#000;border:none;padding:6px 22px;border-radius:6px;font-weight:600;font-size:12px;cursor:pointer;transition:all 0.15s}
.btn-allow:hover{filter:brightness(1.15)}
.btn-allow:disabled{opacity:0.3;cursor:default}
.btn-deny{background:transparent;color:var(--red);border:1px solid rgba(239,68,68,0.3);padding:5px 18px;border-radius:6px;font-weight:600;font-size:12px;cursor:pointer;transition:all 0.15s}
.btn-deny:hover{background:var(--red-bg)}
.btn-deny:disabled{opacity:0.3;cursor:default}
.ab-timer{font-size:11px;color:var(--text-muted);font-family:'Cascadia Code',monospace}
.ab-timer.warn{color:var(--amber)}.ab-timer.expired{color:var(--red)}

/* Detail Panel — card layout */
.detail{flex:1;display:flex;flex-direction:column;padding:18px;gap:14px;overflow-y:auto;background:var(--bg)}
.detail-header{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.detail-title{font-size:20px;font-weight:700;cursor:text}
.detail-title-input{font:inherit;font-weight:700;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;outline:none;min-width:200px;max-width:100%}
.detail-actions{display:flex;gap:6px}
.btn-focus{background:var(--blue-bg);color:var(--blue);border:1px solid rgba(59,130,246,0.2);padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:all var(--dur) var(--ease)}
.btn-focus:hover{background:rgba(59,130,246,0.15);transform:translateY(-1px)}
.btn-remove{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer}
.btn-remove:hover{color:var(--red);border-color:rgba(239,68,68,0.3)}

.detail-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;transition:border-color var(--dur) var(--ease)}
.detail-card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted);margin-bottom:10px}
.detail-card-title .beta-tag{margin-left:8px;font-size:9px;font-weight:700;color:var(--purple);background:var(--purple-bg);padding:2px 5px;border-radius:3px;letter-spacing:0.6px;line-height:1;text-transform:none}
/* Context Budget card */
.budget-card{}
.budget-bar{display:flex;width:100%;height:10px;border-radius:6px;overflow:hidden;background:var(--surface2);margin-bottom:12px}
.budget-bar-seg{height:100%;transition:width var(--dur) var(--ease)}
.budget-bar.legacy .budget-bar-seg{filter:saturate(0)}
.budget-bar-seg.budget-mem{background:var(--blue)}
.budget-bar-seg.budget-sk{background:var(--purple)}
.budget-bar-seg.budget-rea{background:var(--green)}
.budget-rows{display:flex;flex-direction:column;gap:5px;font-variant-numeric:tabular-nums}
.budget-row{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;font-size:12px;color:var(--text)}
.budget-dot{width:10px;height:10px;border-radius:3px}
.budget-dot.budget-mem{background:var(--blue)}
.budget-dot.budget-sk{background:var(--purple)}
.budget-dot.budget-rea{background:var(--green)}
.budget-card.legacy .budget-dot{filter:saturate(0)}
.budget-label{color:var(--text-muted)}
.budget-val{color:var(--text);font-weight:500;text-align:right}
.budget-pct{color:var(--text-dim);text-align:right;min-width:34px}
.budget-legacy-note{margin-top:10px;font-size:10px;color:var(--text-dim);font-style:italic;line-height:1.5}
/* Skill Analytics card */
.skill-card{}
.skill-rows{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.skill-row{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;font-size:12px;padding:4px 0}
.skill-name{color:var(--text);font-weight:500;font-family:'Cascadia Code','Consolas',monospace;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skill-name.unknown{color:var(--text-dim);font-style:italic}
.skill-count{color:var(--purple);font-weight:600;text-align:right;min-width:28px}
.skill-time{color:var(--text-dim);font-size:10px;text-align:right;min-width:60px}
.skill-destr{color:var(--amber);font-size:11px;width:14px;text-align:center}
.skill-totals{font-size:11px;color:var(--text-muted);padding-top:8px;border-top:1px solid var(--border)}
.skill-next-hint{margin-top:8px;padding:8px 10px;background:var(--surface2);border-radius:6px;font-size:11px;color:var(--text-muted);line-height:1.5}
.skill-next-hint strong{color:var(--text);font-weight:600;margin-right:6px}
.skill-next-hint code{font-family:'Cascadia Code','Consolas',monospace;font-size:10px;color:var(--purple);background:var(--purple-bg);padding:1px 5px;border-radius:3px}

.detail-info{display:grid;grid-template-columns:100px 1fr;gap:8px 16px;font-size:13px}
.detail-info dt{color:var(--text-muted)}
.detail-info dd{color:var(--text);font-family:'Cascadia Code','Consolas',monospace;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usage-row{display:flex;gap:10px;flex-wrap:wrap}
.usage-in{color:var(--blue)}
.usage-out{color:var(--green)}
.usage-cache{color:var(--cyan,#06b6d4)}

.detail-top{display:flex;gap:18px;align-items:flex-start}
.detail-top .detail-info{flex:0 0 auto;min-width:280px}
.detail-chart{flex:1;min-width:180px;position:relative}
.detail-chart-empty{color:var(--text-dim);font-size:12px;display:flex;align-items:center;justify-content:center;height:100%;min-height:100px}

.detail-activity-text{font-size:14px;color:var(--text)}
.detail-activity-text .tool{color:var(--purple);font-weight:600}

/* Event Log — inside a card */
.event-card{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px 4px 14px 18px}
.event-card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted);margin-bottom:8px;padding-right:14px}
.event-list{flex:1;overflow-y:auto;padding-right:14px;margin-right:4px}
.ev{padding:5px 0 5px 0;font-size:12px;display:flex;gap:12px;font-family:'Cascadia Code','Consolas',monospace;align-items:center;border-radius:6px}
.ev:hover{background:var(--surface-hover);padding-left:8px;padding-right:8px}
.ev-time{color:var(--text-dim);white-space:nowrap;min-width:60px}
.ev-type{color:var(--purple);min-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-detail{color:var(--text-muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;white-space:nowrap;letter-spacing:0.3px;flex-shrink:0}
.ev-tag.auto{background:rgba(34,197,94,0.12);color:var(--green)}
.ev-tag.user-allow{background:rgba(59,130,246,0.12);color:var(--blue)}
.ev-tag.user-deny{background:rgba(239,68,68,0.12);color:var(--red)}
.ev-tag.pending{background:rgba(245,158,11,0.12);color:var(--amber);animation:blink 1.2s ease-in-out infinite}
.ev-tag.complete{background:rgba(139,92,246,0.12);color:var(--purple)}
.ev.ev-auto{border-left:2px solid var(--green);padding-left:8px}
.ev.ev-user-allow{border-left:2px solid var(--blue);padding-left:8px}
.ev.ev-user-deny{border-left:2px solid var(--red);padding-left:8px}
.ev.ev-pending{border-left:2px solid var(--amber);padding-left:8px}
.ev.ev-complete{border-left:2px solid var(--purple);padding-left:8px}

/* ── Login Screen ── */
.login-screen{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg)}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:32px;width:340px;max-width:90vw}
.login-box h1{font-size:20px;font-weight:700;margin-bottom:4px}
.login-box h1 span{color:var(--purple)}
.login-box p{font-size:13px;color:var(--text-muted);margin-bottom:20px}
.login-box input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:14px;outline:none;margin-bottom:12px}
.login-box input:focus{border-color:var(--purple)}
.login-box button{width:100%;padding:10px;background:var(--purple);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.login-box button:hover{filter:brightness(1.1)}
.login-box button:disabled{opacity:0.5;cursor:default}
.login-error{color:var(--red);font-size:12px;margin-bottom:8px}
.login-hint{font-size:11px;color:var(--text-dim);margin-top:8px;text-align:center}
.btn-logout{background:none;border:1px solid var(--border);color:var(--text-dim);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.btn-logout:hover{color:var(--red);border-color:rgba(239,68,68,0.3)}
.btn-settings{background:none;border:1px solid var(--border);color:var(--text-dim);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all 0.15s}

/* ── Settings Panel ── */
.settings{flex:1;overflow-y:auto;padding:24px}
.settings-title{font-size:20px;font-weight:700;margin-bottom:20px}
.settings-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
.settings-section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);margin-bottom:14px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:13px;color:var(--text)}
.setting-desc{font-size:11px;color:var(--text-dim);margin-top:2px}
.setting-control{flex-shrink:0;margin-left:16px}
.setting-input{width:80px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface2);color:var(--text);font-size:13px;text-align:center;font-family:'Cascadia Code','Consolas',monospace}
.setting-input:focus{outline:none;border-color:var(--purple)}
.setting-unit{font-size:11px;color:var(--text-dim);margin-left:6px}
.toggle{position:relative;width:36px;height:20px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-track{position:absolute;inset:0;background:var(--border-light);border-radius:10px;transition:background 0.2s}
.toggle input:checked+.toggle-track{background:var(--purple)}
.toggle-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:transform 0.2s}
.toggle input:checked~.toggle-thumb{transform:translateX(16px)}
.machine-list{display:flex;flex-direction:column;gap:8px}
.machine-card{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface2);border-radius:8px;font-size:12px}
.machine-card-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.machine-card-dot.active{background:var(--green)}
.machine-card-dot.inactive{background:var(--text-dim)}
.machine-card-info{flex:1;min-width:0}
.machine-card-name{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.machine-card-host{font-size:11px;color:var(--text-dim);font-family:'Cascadia Code','Consolas',monospace}
.machine-card-stats{text-align:right;flex-shrink:0;color:var(--text-muted);font-size:11px}
.sidebar-archived{padding:8px 16px;font-size:11px;color:var(--text-dim);cursor:pointer;text-align:center;transition:color 0.15s}
.sidebar-archived:hover{color:var(--text-muted)}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-light)}

/* ── Mobile ── */
.btn-back{display:none;background:none;border:none;color:var(--text-muted);font-size:13px;cursor:pointer;padding:4px 0;margin-bottom:4px}

  .event-header{padding:8px 16px 4px;font-size:10px}

}

<body>
<div id="root"></div>
<script>
document.documentElement.setAttribute('data-theme',localStorage.getItem('cm-theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'));
(function(){var s=localStorage.getItem('cm-skin')||'default';if(s!=='default')document.getElementById('skin-css').href='/skins/'+encodeURIComponent(s)+'.css'})();
</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js" crossorigin="anonymous"></script>
<script>
const{createElement,useState,useEffect,useRef,useCallback}=React;
const html=htm.bind(createElement);

// ── Helpers ──
function timeAgo(ts){const d=Date.now()-ts;if(d<5e3)return'now';if(d<6e4)return(d/1e3|0)+'s';if(d<36e5)return(d/6e4|0)+'m';if(d<864e5)return(d/36e5|0)+'h';return(d/864e5|0)+'d'}
function clockTime(ts){return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function duration(ms){const m=ms/6e4|0;if(m<60)return m+'m';return(m/60|0)+'h '+(m%60)+'m'}

const STATUS={working:'Working',waiting_permission:'Permission',idle:'Idle',stopped:'Stopped',unknown:'Unknown'};
function fmtTokens(n){if(!n)return'0';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n)}
function fmtCountdown(ms){if(ms==null||ms<0)return'';const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60);if(h>0)return h+'h '+m+'m';if(m>0)return m+'m';return Math.max(1,s)+'s'}
function totalTokens(u){return(u?.input_tokens||0)+(u?.output_tokens||0)+(u?.cache_read_input_tokens||0)+(u?.cache_creation_input_tokens||0)}

let audioCtx;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
// Alert: urgent descending tone for permission/approval
function playAlert(){try{const c=ensureAudio(),n=c.currentTime,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(880,n);o.frequency.setValueAtTime(660,n+.12);o.frequency.setValueAtTime(880,n+.24);g.gain.setValueAtTime(.25,n);g.gain.exponentialRampToValueAtTime(.01,n+.5);o.start(n);o.stop(n+.5)}catch{}}
// Complete: pleasant ascending chime for task done
function playComplete(){try{const c=ensureAudio(),n=c.currentTime;[523.25,659.25,783.99].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(f,n+i*.12);g.gain.setValueAtTime(.18,n+i*.12);g.gain.exponentialRampToValueAtTime(.01,n+i*.12+.35);o.start(n+i*.12);o.stop(n+i*.12+.35)})}catch{}}
function notify(t,b){try{if(Notification.permission==='granted')new Notification(t,{body:b,tag:'cm-'+Date.now()})}catch{}}

// ── Login Screen ──
function LoginScreen({onLogin}){
  const[pw,setPw]=useState('');
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);
  const handleSubmit=async(e)=>{
    e.preventDefault();setErr('');setLoading(true);
    try{
      const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
      const data=await res.json();
      if(res.ok&&data.token){localStorage.setItem('cm-token',data.token);onLogin(data.token)}
      else setErr(data.error||'Login failed');
    }catch{setErr('Cannot connect to server')}
    setLoading(false);
  };
  return html`
    <div className="login-screen">
      <form className="login-box" onSubmit=${handleSubmit}>
        <h1><span>Claude Code</span> Monitor</h1>
        <p>Enter your dashboard password to continue.</p>
        ${err&&html`<div className="login-error">${err}</div>`}
        <input type="password" placeholder="Password" value=${pw} onInput=${e=>setPw(e.target.value)} autoFocus/>
        <button type="submit" disabled=${loading}>${loading?'Signing in...':'Sign In'}</button>
        <div className="login-hint">First time? Enter a new password to set it up.</div>
      </form>
    </div>
  `;
}

// ── Sidebar Item ──
function SidebarItem({s, selected, approvalCount, onClick}){
  return html`
    <div className=${`si ${selected?'selected':''} ${approvalCount>0?'has-approval':''}`} onClick=${onClick}>
      <div className="si-top">
        <div className="si-name" title=${s.title||s.project}>
          <div className=${`si-dot ${s.status}`}></div>
          ${s.title||s.project}
        </div>
        <span className=${`si-badge ${s.status}`}>${STATUS[s.status]||s.status}</span>
      </div>
      ${s.title&&html`<div className="si-project">${s.project}</div>`}
      <div className="si-activity">${s.activityText||'No activity'}</div>
      <div className="si-meta">
        <span>${timeAgo(s.lastActivity)}</span>
        <span>${s.eventCount} events</span>
        ${totalTokens(s.usage)>0&&html`<span>${fmtTokens(totalTokens(s.usage))} tok</span>`}
        ${approvalCount>0&&html`<span className="approval-badge">${approvalCount}</span>`}
      </div>
    </div>
  `;
}

// ── Approval Card ──
function ApprovalCard({a,onDecide}){
  const[elapsed,setElapsed]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setElapsed((Date.now()-a.createdAt)/1e3|0),500);return()=>clearInterval(t)},[a.createdAt]);
  const expired=elapsed>120;
  const tc=expired?'expired':elapsed>90?'warn':'';
  return html`
    <div className="ab-card">
      <div className="ab-card-top">
        <span className="ab-tool">${a.toolName}</span>
        <span className="ab-project">${a.project}</span>
      </div>
      <div className="ab-desc">${a.description}</div>
      <div className="ab-actions">
        <div className="ab-btns">
          <button className="btn-allow" onClick=${()=>onDecide(a.id,'allow')} disabled=${expired}>Allow</button>
          <button className="btn-deny" onClick=${()=>onDecide(a.id,'deny')} disabled=${expired}>Deny</button>
        </div>
        <span className=${`ab-timer ${tc}`}>${expired?'Expired':elapsed+'s'}</span>
      </div>
    </div>
  `;
}

// ── Settings Panel ──
function SettingsPanel({settings, sessions, machineNames, serverHostname, authToken, updateInfo, uiSkin, setUiSkin, onClearArchived, theme, setTheme}){
  const authH={'Authorization':'Bearer '+authToken,'Content-Type':'application/json'};
  const save=(field,val)=>{
    fetch('/api/settings',{method:'POST',headers:authH,body:JSON.stringify({[field]:val})}).catch(()=>{});
  };
  const archivedNow=sessions.filter(s=>s.status==='stopped').length;
  const[checking,setChecking]=useState(false);
  const[applying,setApplying]=useState(false);
  const checkNow=()=>{setChecking(true);fetch('/api/update/check',{method:'POST',headers:authH}).then(r=>r.json()).then(()=>setChecking(false)).catch(()=>setChecking(false))};
  const applyNow=()=>{if(!confirm('This will pull the latest code and may require a server restart. Continue?'))return;setApplying(true);fetch('/api/update/apply',{method:'POST',headers:authH}).then(r=>r.json()).then(r=>{setApplying(false);if(r.needsRestart)alert('Updated to v'+r.version+'. Please restart the server.')}).catch(()=>setApplying(false))};

  // Group sessions by machine
  const machines={};
  sessions.forEach(s=>{
    const h=s.hostname||'local';
    if(!machines[h])machines[h]={hostname:h,displayName:machineNames[h]||h,sessions:[],lastActivity:0};
    machines[h].sessions.push(s);
    if(s.lastActivity>machines[h].lastActivity)machines[h].lastActivity=s.lastActivity;
  });
  const machineList=Object.values(machines).sort((a,b)=>b.lastActivity-a.lastActivity);

  const renameMachine=(hostname,name)=>{
    fetch('/api/machines/'+encodeURIComponent(hostname)+'/rename',{method:'POST',headers:authH,body:JSON.stringify({name})}).catch(()=>{});
  };

  return html`<div className="settings">
    <div className="settings-title">Settings</div>

    <div className="settings-section">
      <div className="settings-section-title">Display</div>
      <div className="setting-row">
        <div>
          <div className="setting-label">Token Usage Chart</div>
          <div className="setting-desc">Show token consumption graph in session detail</div>
        </div>
        <label className="toggle">
          <input type="checkbox" checked=${settings.showTokenChart!==false}
            onChange=${e=>save('showTokenChart',e.target.checked)}/>
          <div className="toggle-track"></div>
          <div className="toggle-thumb"></div>
        </label>
      </div>
      <div className="setting-row">
        <div>
          <div className="setting-label">Auto-archive stopped sessions</div>
          <div className="setting-desc">Hide stopped sessions from sidebar. They remain in the Archive view and are never auto-deleted.</div>
        </div>
        <label className="toggle">
          <input type="checkbox" checked=${!!settings.autoArchiveStopped}
            onChange=${e=>save('autoArchiveStopped',e.target.checked)}/>
          <div className="toggle-track"></div>
          <div className="toggle-thumb"></div>
        </label>
      </div>
      <div className="setting-row">
        <div>
          <div className="setting-label">5h Burn Pill <span style=${{fontSize:'9px',fontWeight:700,color:'var(--purple)',border:'1px solid var(--purple)',padding:'1px 4px',borderRadius:'3px',marginLeft:'6px',letterSpacing:'0.5px'}}>BETA</span></div>
          <div className="setting-desc">Show the 5h rolling burn estimate in the sidebar header. Estimate is approximate — not yet aligned with Anthropic's official usage numbers.</div>
        </div>
        <label className="toggle">
          <input type="checkbox" checked=${settings.showBurnPill!==false}
            onChange=${e=>save('showBurnPill',e.target.checked)}/>
          <div className="toggle-track"></div>
          <div className="toggle-thumb"></div>
        </label>
      </div>
      <div className="setting-row">
        <div>
          <div className="setting-label">Context Budget <span style=${{fontSize:'9px',fontWeight:700,color:'var(--purple)',border:'1px solid var(--purple)',padding:'1px 4px',borderRadius:'3px',marginLeft:'6px',letterSpacing:'0.5px'}}>BETA</span></div>
          <div className="setting-desc">In each session's detail panel, show how the tokens split across memory / skills / reasoning. Uses Anthropic's own cache TTL breakdown (ephemeral_1h vs ephemeral_5m).</div>
        </div>
        <label className="toggle">
          <input type="checkbox" checked=${settings.showContextBudget!==false}
            onChange=${e=>save('showContextBudget',e.target.checked)}/>
          <div className="toggle-track"></div>
          <div className="toggle-thumb"></div>
        </label>
      </div>
      <div className="setting-row">
        <div>
          <div className="setting-label">Skill Analytics <span style=${{fontSize:'9px',fontWeight:700,color:'var(--purple)',border:'1px solid var(--purple)',padding:'1px 4px',borderRadius:'3px',marginLeft:'6px',letterSpacing:'0.5px'}}>BETA</span></div>
          <div className="setting-desc">In each session's detail panel, show which CCB-skills you invoked, how often, and a "Next?" hint based on each skill's frontmatter <code>suggests_next</code>. Set the repo path below if auto-probe fails.</div>
        </div>
        <label className="toggle">
          <input type="checkbox" checked=${settings.showSkillAnalytics!==false}
            onChange=${e=>save('showSkillAnalytics',e.target.checked)}/>
          <div className="toggle-track"></div>
          <div className="toggle-thumb"></div>
        </label>
      </div>
      <div className="setting-row">
        <div>
          <div className="setting-label">CCB-skills repo path</div>
          <div className="setting-desc">Absolute path to the CCB-skills repository. Leave empty for auto-probe (~/CCB-skills, ~/Projects/CCB-skills, ~/code/CCB-skills, ~/dev/CCB-skills). Server restart required to reload.</div>
        </div>
        <input type="text" defaultValue=${settings.skillRepoPath||''}
          onBlur=${e=>save('skillRepoPath',e.target.value.trim())}
          placeholder="auto-probe"
          style=${{fontFamily:"'Cascadia Code','Consolas',monospace",fontSize:'11px',padding:'6px 10px',width:'260px',borderRadius:'6px',border:'1px solid var(--border)',background:'var(--bg)',color:'var(--text)'}}/>
      </div>
    </div>

    <div className="settings-section">
      <div className="settings-section-title">Data</div>
      <div className="setting-row">
        <div>
          <div className="setting-label">Archived sessions</div>
          <div className="setting-desc">${archivedNow===0?'No archived sessions to clear.':archivedNow+' archived session'+(archivedNow>1?'s':'')+' currently stored. Deleting cannot be undone.'}</div>
        </div>
        <button className="btn-xs danger"
          disabled=${archivedNow===0}
          style=${{opacity:archivedNow===0?0.4:1,cursor:archivedNow===0?'default':'pointer'}}
          onClick=${()=>{if(confirm('Delete all '+archivedNow+' archived sessions? This cannot be undone.'))onClearArchived()}}>
          Clear archived${archivedNow>0?' ('+archivedNow+')':''}
        </button>
      </div>
    </div>

    <div className="settings-section">
      <div className="settings-section-title">Connected Machines</div>
      ${machineList.length>0&&html`<div className="machine-list" style=${{marginBottom:'14px'}}>
          ${machineList.map(m=>{
            const active=m.sessions.filter(s=>s.status!=='stopped').length;
            const total=m.sessions.length;
            const isServer=m.hostname===serverHostname;
            return html`<div className="machine-card" key=${m.hostname}>
              <div className=${`machine-card-dot ${active>0?'active':'inactive'}`}></div>
              <div className="machine-card-info">
                <div className="machine-card-name">
                  ${m.displayName}${isServer?' (server)':''}
                </div>
                <div className="machine-card-host">${m.hostname}</div>
              </div>
              <div className="machine-card-stats">
                ${active} active / ${total} total<br/>
                ${m.lastActivity?timeAgo(m.lastActivity):'—'}
              </div>
            </div>`})}
        </div>`
      }
      <div style=${{borderTop:machineList.length?'1px solid var(--border)':'none',paddingTop:machineList.length?'14px':'0'}}>
        <div className="setting-label" style=${{marginBottom:'8px'}}>Add a new machine</div>
        <div className="setting-desc" style=${{marginBottom:'8px'}}>Run this command on the remote machine to connect it to this monitor:</div>
        <div style=${{position:'relative'}}>
          <pre style=${{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:'8px',padding:'12px',fontSize:'11px',fontFamily:"'Cascadia Code','Consolas',monospace",color:'var(--text)',overflowX:'auto',whiteSpace:'pre-wrap',wordBreak:'break-all',margin:0,paddingRight:'40px'}}>npx claude-code-monitor-client --url=${location.protocol+'//'+location.host} --token=${authToken}</pre>
          <button onClick=${()=>{navigator.clipboard.writeText('npx claude-code-monitor-client --url='+location.protocol+'//'+location.host+' --token='+authToken);}} style=${{position:'absolute',top:'8px',right:'8px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'4px',padding:'4px 8px',fontSize:'10px',color:'var(--text-muted)',cursor:'pointer'}} title="Copy to clipboard">Copy</button>
        </div>
        <div className="setting-desc" style=${{marginTop:'8px'}}>Or manually: clone this repo on the remote machine and run:<br/>
          <code style=${{fontSize:'11px',color:'var(--purple)'}}>node install-hooks.js --url=${location.protocol+'//'+location.host} --token=${authToken}</code>
        </div>
      </div>

// ── Token Usage Chart (scrolling line chart) ──
function TokenChart({history, sessionId, theme}){
  const canvasRef=useRef(null);
  const chartRef=useRef(null);

  // Cleanup on unmount
  useEffect(()=>()=>{if(chartRef.current){chartRef.current.destroy();chartRef.current=null}},[]);

  useEffect(()=>{
    if(!canvasRef.current)return;

    // Session changed — destroy old chart
    if(chartRef.current&&chartRef.current._sid!==sessionId){
      chartRef.current.destroy();chartRef.current=null;
    }
    if(!history||!history.length){
      if(chartRef.current){chartRef.current.destroy();chartRef.current=null}
      return;
    }

    const cs=getComputedStyle(document.documentElement);
    const v=k=>cs.getPropertyValue(k).trim();
    const dim=v('--text-dim'),brd=v('--border'),blue=v('--blue'),green=v('--green'),amber=v('--amber'),cyan=v('--cyan')||'#06b6d4';

    const labels=history.map(h=>clockTime(h.time));
    const ds=[
      {label:'Input',   data:history.map(h=>h.input),      borderColor:blue, backgroundColor:blue+'18',  fill:true},
      {label:'Output',  data:history.map(h=>h.output),     borderColor:green,backgroundColor:green+'18', fill:true},
      {label:'Cached',  data:history.map(h=>h.cached),     borderColor:cyan, backgroundColor:cyan+'18',  fill:true},
      {label:'Cache-W', data:history.map(h=>h.cacheWrite), borderColor:amber,backgroundColor:amber+'10', fill:true},
    ];
    ds.forEach(d=>Object.assign(d,{tension:.35,pointRadius:0,pointHitRadius:8,borderWidth:1.5}));

    // Compute nice Y max from visible datasets only
    function computeNiceMax(chart){
      let vals=[];
      const keys=['input','output','cached','cacheWrite'];
      history.forEach(h=>{
        keys.forEach((k,i)=>{if(!chart||!chart.getDatasetMeta(i).hidden)vals.push(h[k])});
      });
      if(!vals.length)vals=[1];
      const mx=Math.max(...vals,1)*1.15;
      const mg=Math.pow(10,Math.floor(Math.log10(mx)));
      return Math.ceil(mx/mg)*mg;
    }
    const niceMax=computeNiceMax(chartRef.current);

    if(chartRef.current){
      // Incremental update — smooth animated transition on both axes
      const c=chartRef.current;
      c.data.labels=labels;
      ds.forEach((d,i)=>{
        // Preserve hidden state when updating data
        const hidden=c.getDatasetMeta(i).hidden;
        Object.assign(c.data.datasets[i],d);
        if(hidden)c.getDatasetMeta(i).hidden=true;
      });

      // Animate Y-axis rescaling based on visible datasets
      const visMax=computeNiceMax(c);
      c.options.scales.y.max=visMax;
      c.options.scales.y.ticks.stepSize=visMax>0?visMax/4:undefined;

      // Update colors for theme switch
      c.options.scales.x.ticks.color=dim;c.options.scales.x.grid.color=brd;
      c.options.scales.y.ticks.color=dim;c.options.scales.y.grid.color=brd;
      c.options.plugins.legend.labels.color=dim;

      // Adapt X tick density based on data count
      c.options.scales.x.ticks.maxTicksLimit=history.length<=10?history.length:Math.min(8,Math.max(4,Math.floor(history.length/3)));

      c.update();
      return;
    }

    // Create new chart
    chartRef.current=new Chart(canvasRef.current,{
      type:'line',
      data:{labels,datasets:ds},
      options:{
        responsive:true,maintainAspectRatio:false,
        animation:{duration:500,easing:'easeOutQuart'},
        transitions:{
          active:{animation:{duration:200}},
          resize:{animation:{duration:0}}
        },
        interaction:{mode:'index',intersect:false},
        plugins:{
          legend:{display:true,position:'top',
            onClick:(e,item,legend)=>{
              // Default toggle behavior
              const ci=legend.chart;
              const idx=item.datasetIndex;
              ci.getDatasetMeta(idx).hidden=!ci.getDatasetMeta(idx).hidden;
              // Recompute Y-axis for visible datasets only
              const vm=computeNiceMax(ci);
              ci.options.scales.y.max=vm;
              ci.options.scales.y.ticks.stepSize=vm>0?vm/4:undefined;
              ci.update();
            },
            labels:{boxWidth:8,padding:10,font:{size:10},usePointStyle:true,pointStyle:'circle',
              generateLabels:chart=>{
                const txt=getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
                const dm=getComputedStyle(document.documentElement).getPropertyValue('--text-dim').trim();
                return chart.data.datasets.map((ds,i)=>{
                  const hidden=chart.getDatasetMeta(i).hidden;
                  return{text:ds.label,fontColor:hidden?dm:txt,fillStyle:hidden?dm:ds.borderColor,strokeStyle:hidden?dm:ds.borderColor,hidden:false,datasetIndex:i,pointStyle:'circle'}
                })}}
          },
          tooltip:{
            backgroundColor:'rgba(0,0,0,0.8)',titleFont:{size:11},bodyFont:{size:11},
            callbacks:{
              title:items=>items[0]?.label||'',
              label:ctx=>' '+ctx.dataset.label+': '+fmtTokens(ctx.parsed.y)
            }
          }
        },
        scales:{
          x:{
            ticks:{color:dim,font:{size:9},maxTicksLimit:history.length<=10?history.length:Math.min(8,Math.max(4,Math.floor(history.length/3))),maxRotation:0},
            grid:{color:brd,drawTicks:false},
            border:{display:false}
          },
          y:{
            max:niceMax,
            ticks:{color:dim,font:{size:9},callback:v=>fmtTokens(v),stepSize:niceMax>0?niceMax/4:undefined,maxTicksLimit:5},
            grid:{color:brd,drawTicks:false},
            border:{display:false},
            beginAtZero:true
          }
        }
      }
    });
    chartRef.current._sid=sessionId;
  },[history,sessionId,theme]);

  return html`<div className="detail-chart">
    <canvas ref=${canvasRef} style=${{display:history&&history.length?'block':'none'}}></canvas>
    ${(!history||!history.length)&&html`<div className="detail-chart-empty">No token data yet</div>`}
  </div>`;
}

// ── Context Budget Card ──
// Renders the memory / skills / reasoning split as a horizontal stacked
// bar with a numeric breakdown below. Legacy sessions (no _breakdown
// field on the source usage object, so hasBreakdown is false) render in
// muted grayscale with an explanatory subtitle.
function ContextBudgetCard({budget}){
  if(!budget||!budget.total)return null;
  const total=budget.total;
  const memPct=Math.max(0,Math.min(100,(budget.memory/total)*100));
  const skPct=Math.max(0,Math.min(100,(budget.skills/total)*100));
  const reaPct=Math.max(0,Math.min(100,(budget.reasoning/total)*100));
  const legacy=!budget.hasBreakdown;
  const memTitle=budget.cacheRead>0
    ?`Memory: ${fmtTokens(budget.memory)} tokens (includes ${fmtTokens(budget.cacheRead)} cache reads — billed at ~10%)`
    :`Memory: ${fmtTokens(budget.memory)} tokens`;
  return html`
    <div className="detail-card budget-card">
      <div className="detail-card-title">
        Context Budget <span className="beta-tag">BETA</span>
      </div>
      <div className=${`budget-bar ${legacy?'legacy':''}`}>
        <div className="budget-bar-seg budget-mem" style=${{width:memPct+'%'}} title=${memTitle}></div>
        <div className="budget-bar-seg budget-sk" style=${{width:skPct+'%'}} title=${`Skills: ${fmtTokens(budget.skills)} tokens (long-lived cached system prompt + tools)`}></div>
        <div className="budget-bar-seg budget-rea" style=${{width:reaPct+'%'}} title=${`Reasoning: ${fmtTokens(budget.reasoning)} tokens (model output)`}></div>
      </div>
      <div className="budget-rows">
        <div className="budget-row" title=${memTitle}>
          <span className="budget-dot budget-mem"></span>
          <span className="budget-label">Memory</span>
          <span className="budget-val">${fmtTokens(budget.memory)}</span>
          <span className="budget-pct">${Math.round(memPct)}%</span>
        </div>
        <div className="budget-row" title="Skills: long-lived cached system prompt + tools + skill bodies">
          <span className="budget-dot budget-sk"></span>
          <span className="budget-label">Skills</span>
          <span className="budget-val">${fmtTokens(budget.skills)}</span>
          <span className="budget-pct">${Math.round(skPct)}%</span>
        </div>
        <div className="budget-row" title="Reasoning: model output (text + tool_use + thinking)">
          <span className="budget-dot budget-rea"></span>
          <span className="budget-label">Reasoning</span>
          <span className="budget-val">${fmtTokens(budget.reasoning)}</span>
          <span className="budget-pct">${Math.round(reaPct)}%</span>
        </div>
      </div>
      ${legacy&&html`<div className="budget-legacy-note">Legacy totals (recorded before v1.7.0-beta.1) — new sessions will show role breakdown</div>`}
    </div>
  `;
}

// ── Skill Analytics Card ──
// Renders per-skill counts, last-used timestamps, destructive flags,
// and an actionable "Next?" hint when the last call's frontmatter
// suggests a follow-up the user has not yet invoked.
function SkillAnalyticsCard({stats}){
  if(!stats||!stats.totals||stats.totals.totalCalls===0)return null;
  const rows=Object.values(stats.perSkill).sort((a,b)=>b.lastUsed-a.lastUsed||b.count-a.count).slice(0,8);
  // "Next?" hint logic (Q2 decision: only show when the user has NOT
  // yet invoked any of the suggested follow-ups for the most recent call)
  let nextHint=null;
  if(stats.lastCall){
    const lastSkill=stats.perSkill[stats.lastCall.name];
    if(lastSkill&&Array.isArray(lastSkill.suggestsNext)&&lastSkill.suggestsNext.length>0){
      const invoked=new Set(Object.keys(stats.perSkill));
      const unInvoked=lastSkill.suggestsNext.filter(n=>!invoked.has(n));
      if(unInvoked.length>0){
        nextHint={from:stats.lastCall.name,suggested:unInvoked};
      }
    }
  }
  const t=stats.totals;
  return html`
    <div className="detail-card skill-card">
      <div className="detail-card-title">
        Skill Analytics <span className="beta-tag">BETA</span>
      </div>
      <div className="skill-rows">
        ${rows.map(r=>html`
          <div className="skill-row" key=${r.name} title=${r.unknown?'Skill not found in CCB-skills frontmatter':(r.destructive?'Destructive: writes to source':'Read-only / non-destructive')}>
            <span className=${`skill-name${r.unknown?' unknown':''}`}>${r.name}</span>
            <span className="skill-count">×${r.count}</span>
            <span className="skill-time">${timeAgo(r.lastUsed)}</span>
            ${r.destructive&&html`<span className="skill-destr" title="Destructive — writes to source">⚠</span>`}
          </div>
        `)}
      </div>
      <div className="skill-totals">
        ${t.totalCalls} call${t.totalCalls===1?'':'s'} · ${t.distinctSkills} distinct${t.destructiveCalls>0?' · '+t.destructiveCalls+' destructive':''}${t.unknownCalls>0?' · '+t.unknownCalls+' unknown':''}
      </div>
      ${nextHint&&html`
        <div className="skill-next-hint">
          <strong>Next?</strong> After <code>${nextHint.from}</code>, frontmatter suggests: ${nextHint.suggested.map((n,i)=>html`${i>0?' / ':''}<code>${n}</code>`)}
        </div>
      `}
    </div>
  `;
}

// ── Detail Panel ──
function DetailPanel({s, approvals, onDecide, onFocus, onRemove, onRename, onBack, machineNames, theme, serverHostname, showTokenChart, showContextBudget, showSkillAnalytics}){
  const [editingTitle,setEditingTitle]=useState(false);
  const [titleDraft,setTitleDraft]=useState('');
  useEffect(()=>{setEditingTitle(false)},[s&&s.id]);
  const startEdit=()=>{if(!s)return;setTitleDraft(s.title||s.project||'');setEditingTitle(true)};
  const commitEdit=()=>{if(!s)return;const v=titleDraft.trim();onRename&&onRename(s.id,v);setEditingTitle(false)};
  if(!s) return html`
    <div className="main-empty">
      <p>Select a session from the left panel to view details.<br/><br/>
        Make sure hooks are installed:<br/><code>npm run install-hooks</code>
      </p>
    </div>
  `;

  const sessionApprovals = approvals.filter(a=>a.sessionId===s.id && a.status==='pending');

  return html`
    <div className="detail">
      <div className="detail-header">
        ${editingTitle
          ?html`<input className="detail-title detail-title-input" autoFocus value=${titleDraft}
              onInput=${e=>setTitleDraft(e.target.value)}
              onBlur=${commitEdit}
              onKeyDown=${e=>{if(e.key==='Enter')commitEdit();else if(e.key==='Escape')setEditingTitle(false)}}
              maxLength=${120}/>`
          :html`<div className="detail-title" title="Click to rename" onClick=${startEdit}>${s.title||s.project}</div>`}
        <div className="detail-actions">
          <button className="btn-back" onClick=${onBack}>Back</button>
          ${/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&s.hostname===serverHostname&&html`
            <button className="btn-focus" onClick=${()=>onFocus(s.id)} title="Focus the session window">Focus Window</button>
          `}
          <button className="btn-remove" onClick=${()=>onRemove(s.id)}>Remove</button>
        </div>
      </div>

      <div className="detail-card">
        ${showTokenChart?html`
          <div className="detail-top">
            <dl className="detail-info">
              <dt>Status</dt><dd>${STATUS[s.status]||s.status}</dd>
              <dt>Machine</dt><dd>${machineNames[s.hostname]||s.hostname||'local'}</dd>
              <dt>Project</dt><dd>${s.project}</dd>
            <dt>Path</dt><dd title=${s.cwd}>${s.cwd}</dd>
              <dt>Started</dt><dd>${clockTime(s.startedAt)} (${duration(Date.now()-s.startedAt)})</dd>
              <dt>Last active</dt><dd>${timeAgo(s.lastActivity)}</dd>
              <dt>Events</dt><dd>${s.eventCount}</dd>
              ${totalTokens(s.usage)>0&&html`
                <dt>Tokens</dt>
                <dd className="usage-row">
                  <span className="usage-in" title="Input tokens">${fmtTokens(s.usage.input_tokens)} in</span>
                  <span className="usage-out" title="Output tokens">${fmtTokens(s.usage.output_tokens)} out</span>
                  ${s.usage.cache_read_input_tokens>0&&html`<span className="usage-cache" title="Cache read">${fmtTokens(s.usage.cache_read_input_tokens)} cached</span>`}
                  ${s.usage.cache_creation_input_tokens>0&&html`<span className="usage-cache" title="Cache creation">${fmtTokens(s.usage.cache_creation_input_tokens)} cache-write</span>`}
                </dd>
              `}
            </dl>
            <${TokenChart} history=${s.usageHistory} sessionId=${s.id} theme=${theme}/>
          </div>
        `:html`
          <dl className="detail-info">
            <dt>Status</dt><dd>${STATUS[s.status]||s.status}</dd>
            <dt>Machine</dt><dd>${machineNames[s.hostname]||s.hostname||'local'}</dd>
            <dt>Project</dt><dd>${s.project}</dd>
            <dt>Path</dt><dd title=${s.cwd}>${s.cwd}</dd>
            <dt>Started</dt><dd>${clockTime(s.startedAt)} (${duration(Date.now()-s.startedAt)})</dd>
            <dt>Last active</dt><dd>${timeAgo(s.lastActivity)}</dd>
            <dt>Events</dt><dd>${s.eventCount}</dd>
            ${totalTokens(s.usage)>0&&html`
              <dt>Tokens</dt>
              <dd className="usage-row">
                <span className="usage-in" title="Input tokens">${fmtTokens(s.usage.input_tokens)} in</span>
                <span className="usage-out" title="Output tokens">${fmtTokens(s.usage.output_tokens)} out</span>
                ${s.usage.cache_read_input_tokens>0&&html`<span className="usage-cache" title="Cache read">${fmtTokens(s.usage.cache_read_input_tokens)} cached</span>`}
                ${s.usage.cache_creation_input_tokens>0&&html`<span className="usage-cache" title="Cache creation">${fmtTokens(s.usage.cache_creation_input_tokens)} cache-write</span>`}
              </dd>
            `}
          </dl>
        `}
      </div>

      ${showContextBudget&&s.usage&&s.usage._budget&&s.usage._budget.total>0&&html`<${ContextBudgetCard} budget=${s.usage._budget}/>`}

      ${showSkillAnalytics&&s.skillStats&&s.skillStats.totals&&s.skillStats.totals.totalCalls>0&&html`<${SkillAnalyticsCard} stats=${s.skillStats}/>`}

      <div className="detail-card">
        <div className="detail-card-title">Current Activity</div>
        <div className="detail-activity-text">
          ${s.currentTool
            ? html`<span className="tool">${s.currentTool}</span> ${s.toolDetail||''}`
            : (s.activityText||'No activity')}
        </div>
      </div>

      ${sessionApprovals.length>0 && html`
        <div className="detail-card" style=${{borderColor:'var(--amber)',background:'var(--amber-bg)'}}>
          <div className="detail-card-title" style=${{color:'var(--amber)'}}>Pending Approval</div>
          <div className="ab-cards">
            ${sessionApprovals.map(a=>html`<${ApprovalCard} key=${a.id} a=${a} onDecide=${onDecide}/>`)}
          </div>
        </div>
      `}

      <div className="detail-card event-card">
        <div className="event-card-title">Recent Events (${s.recentEvents.length})</div>
        <div className="event-list">
          ${s.recentEvents.map((ev,i)=>{
            const ac=ev.approval;
            const isCmp=ev.type==='Stop';
            const evCls='ev'+(ac==='auto'?' ev-auto':ac==='user_allow'?' ev-user-allow':ac==='user_deny'?' ev-user-deny':ac==='pending'?' ev-pending':isCmp?' ev-complete':'');
            const tagCls=ac==='auto'?'auto':ac==='user_allow'?'user-allow':ac==='user_deny'?'user-deny':ac==='pending'?'pending':isCmp?'complete':null;
            const tagText=ac==='auto'?'AUTO':ac==='user_allow'?'ALLOWED':ac==='user_deny'?'DENIED':ac==='pending'?'PENDING':isCmp?'DONE':null;
            return html`
              <div className=${evCls} key=${i}>
                <span className="ev-time">${clockTime(ev.time)}</span>
                <span className="ev-type">${ev.tool||ev.type}</span>
                <span className="ev-detail" title=${ev.detail||''}>${ev.detail||''}</span>
                ${tagText&&html`<span className=${`ev-tag ${tagCls}`}>${tagText}</span>`}
              </div>
            `})}
        </div>
      </div>
    </div>
  `;
}

    fetch('/api/settings',{method:'POST',headers:{'Authorization':'Bearer '+(localStorage.getItem('cm-token')||''),'Content-Type':'application/json'},body:JSON.stringify({uiSkin:v})}).catch(()=>{});
  },[]);
  const wsRef=useRef(null);
  const reconnRef=useRef(null);

  // Verify stored token on load
  useEffect(()=>{
    if(!authToken){setAuthChecked(true);return}
    fetch('/api/auth/check',{headers:{'Authorization':'Bearer '+authToken}})
      .then(r=>{if(!r.ok){localStorage.removeItem('cm-token');setAuthToken(null)}setAuthChecked(true)})
      .catch(()=>setAuthChecked(true));
  },[]);

  const logout=useCallback(()=>{localStorage.removeItem('cm-token');setAuthToken(null)},[]);

  useEffect(()=>{document.documentElement.setAttribute('data-theme',theme);localStorage.setItem('cm-theme',theme)},[theme]);
  const toggleTheme=useCallback(()=>setTheme(t=>t==='dark'?'light':'dark'),[]);

  useEffect(()=>{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()},[]);
  useEffect(()=>{const t=setInterval(()=>setTick(k=>k+1),5e3);return()=>clearInterval(t)},[]);

  // Tab title
  useEffect(()=>{
    const n=pending.filter(a=>a.status==='pending').length+sessions.filter(s=>s.status==='waiting_permission').length;
    document.title=n>0?'('+n+') Claude Code Monitor':'Claude Code Monitor';
  },[sessions,pending]);

  // Auto-select first session or session with new approval
  useEffect(()=>{
    if(sessions.length>0&&!sessions.find(s=>s.id===selectedId)){
      setSelectedId(sessions[0].id);
    }
  },[sessions]);

  // WebSocket
  const connect=useCallback(()=>{
    if(wsRef.current&&wsRef.current.readyState<=1)return;
    const ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws?token='+encodeURIComponent(authToken));
    ws.onopen=()=>{setConnected(true);if(reconnRef.current){clearTimeout(reconnRef.current);reconnRef.current=null}};
    ws.onclose=(e)=>{setConnected(false);wsRef.current=null;if(e.code===4001){logout();return}reconnRef.current=setTimeout(connect,3e3)};
    ws.onerror=()=>ws.close();
    ws.onmessage=e=>{try{
      const d=JSON.parse(e.data);
      if(d.sessions)setSessions(d.sessions);
      if(d.pendingApprovals)setPending(d.pendingApprovals);
      if(d.settings){setRemoteApproval(d.settings.remoteApprovalEnabled);setAutoApprove(!!d.settings.autoApproveEnabled);setSettings(d.settings);if(d.settings.uiSkin&&d.settings.uiSkin!==uiSkin&&['default','linear','sentry','raycast','claude'].includes(d.settings.uiSkin)){setUiSkinLocal(d.settings.uiSkin);localStorage.setItem('cm-skin',d.settings.uiSkin);const link=document.getElementById('skin-css');if(link)link.href=d.settings.uiSkin==='default'?'':'/skins/'+d.settings.uiSkin+'.css'}}
      if(d.machineNames)setMNames(d.machineNames);
      if(d.serverHostname)setServerHost(d.serverHostname);
      if(d.updateState)setUpdateInfo(d.updateState);
      if(d.anomalyState)setAnomalyState(d.anomalyState);
      if(d.anomalyAlerts&&d.anomalyAlerts.length){
        const a=d.anomalyAlerts[0];
        setAnomalyToast({id:a.id,severity:a.severity,sessionId:a.sessionId,time:Date.now()});
        if(sound)playAlert();
        notify('Token Anomaly: '+a.id, 'Session '+a.sessionId.slice(0,8));
        setTimeout(()=>setAnomalyToast(null),8000);
      }
      if(d.alert){
        if(d.alert.type==='complete'){
          if(sound)playComplete();
          notify('Task Complete',d.alert.session.project+' — '+d.alert.detail);
        } else {
          if(sound)playAlert();
        }
        if(d.alert.type==='permission')notify('Permission Required',d.alert.session.project+' needs permission');
        if(d.alert.type==='approval'){
          notify('Approval Required',d.alert.approval.toolName+' in '+d.alert.approval.project);
          setSelectedId(d.alert.approval.sessionId);setMobileDetail(true);
        }
      }
    }catch{}};
    wsRef.current=ws;
  },[sound,authToken]);

  useEffect(()=>{
    if(!authToken)return;
    connect();return()=>{if(wsRef.current)wsRef.current.close();if(reconnRef.current)clearTimeout(reconnRef.current)}
  },[connect,authToken]);

  const authH={'Authorization':'Bearer '+authToken,'Content-Type':'application/json'};
  const focusSession=useCallback(id=>{fetch('/api/sessions/'+id+'/focus',{method:'POST',headers:authH}).catch(()=>{})},[authToken]);
  const removeSession=useCallback(id=>{fetch('/api/sessions/'+id,{method:'DELETE',headers:authH}).catch(()=>{});if(selectedId===id){setSelectedId(null);setMobileDetail(false)}},[selectedId,authToken]);
  const clearStopped=useCallback(()=>{fetch('/api/clear-stopped',{method:'POST',headers:authH}).catch(()=>{})},[authToken]);
  const toggleRA=useCallback(()=>{const v=!remoteApproval;setRemoteApproval(v);fetch('/api/settings',{method:'POST',headers:authH,body:JSON.stringify({remoteApprovalEnabled:v})}).catch(()=>{})},[remoteApproval,authToken]);
  const toggleAA=useCallback(()=>{const v=!autoApprove;if(v&&!confirm('⚠️ This will automatically ALLOW all permission requests without review. Are you sure?'))return;setAutoApprove(v);fetch('/api/settings',{method:'POST',headers:authH,body:JSON.stringify({autoApproveEnabled:v})}).catch(()=>{})},[autoApprove,authToken]);
  const decideApproval=useCallback((id,dec)=>{fetch('/api/pending/'+id+'/decide',{method:'POST',headers:authH,body:JSON.stringify({decision:dec})}).catch(()=>{})},[authToken]);
  const renameMachine=useCallback((hostname,name)=>{fetch('/api/machines/'+encodeURIComponent(hostname)+'/rename',{method:'POST',headers:authH,body:JSON.stringify({name})}).catch(()=>{})},[authToken]);
  const renameSession=useCallback((id,title)=>{fetch('/api/sessions/'+id+'/title',{method:'POST',headers:authH,body:JSON.stringify({title})}).catch(()=>{})},[authToken]);

  // Auth guards (after all hooks)
  if(!authChecked)return html`<div className="login-screen"><div style=${{color:'var(--text-muted)'}}>Loading...</div></div>`;
  if(!authToken)return html`<${LoginScreen} onLogin=${t=>setAuthToken(t)}/>`;

  const selected=sessions.find(s=>s.id===selectedId)||null;
  const globalPending=pending.filter(a=>a.status==='pending');
  const nowMs=Date.now();
  const stoppedCount=sessions.filter(s=>s.status==='stopped'||(s.status==='idle'&&nowMs-s.lastActivity>3600000)).length;
  const archivedCount=settings.autoArchiveStopped?stoppedCount:0;

  // Filter sessions for sidebar (archive stopped if enabled and not showing archived)
  const visibleSessions=settings.autoArchiveStopped&&!showArchived
    ?sessions.filter(s=>s.status!=='stopped')
    :sessions;

  // Group sessions by machine
  const machineGroups=[];
  const byHost={};
  visibleSessions.forEach(s=>{const h=s.hostname||'local';if(!byHost[h])byHost[h]=[];byHost[h].push(s)});
  Object.keys(byHost).sort().forEach(h=>machineGroups.push({hostname:h,displayName:mNames[h]||h,sessions:byHost[h]}));

  // Count pending approvals per session
  const approvalCounts={};
  globalPending.forEach(a=>{approvalCounts[a.sessionId]=(approvalCounts[a.sessionId]||0)+1});

  return html`
    <div className=${`app ${mobileDetail?'mobile-detail':''}`}>
      <div className="sidebar">
        <div className="sidebar-header">
          <div className="logo"><span>Claude Code</span> Monitor</div>
          <div className="header-right">
            <button className=${`btn-settings${showSettings?' active':''}`} onClick=${()=>{setShowSettings(!showSettings);if(!showSettings){setSelectedId(null);setMobileDetail(true)}}} title="Settings">\u2699</button>
            <button className="btn-logout" onClick=${logout} title="Logout">⏻</button>
            ${!connected&&html`<div className="conn-dot offline" title="Disconnected — trying to reconnect"></div>`}
          </div>
        </div>
        ${settings.showBurnPill!==false&&anomalyState&&anomalyState.enabled&&html`
          <div className=${`burn-pill burn-${anomalyState.level}`} title=${`5h session window. burn10m=${Math.round(anomalyState.burn10m)} tok/min, burn1h=${Math.round(anomalyState.burn1h)} tok/min${anomalyState.isPeakHour?' (peak hours)':''}\n\nBETA: estimate is approximate and not yet aligned with Anthropic's official usage numbers.`}>
            <div className="burn-pill-row">
              <span className="beta-tag">BETA</span>
              <span>5h:</span>
              <strong>${(anomalyState.window5hTotal/1e6).toFixed(2)}M</strong>
              <span>/ ${(anomalyState.window5hLimitTokens/1e6).toFixed(0)}M</span>
              <span className="burn-pct">(${Math.round(anomalyState.window5hRatio*100)}%)</span>
              ${anomalyState.isPeakHour&&html`<span className="peak-tag">PEAK</span>`}
            </div>
            ${anomalyState.windowEnd!=null&&html`
              <div className="burn-pill-reset">Resets in ${fmtCountdown(anomalyState.windowEnd-Date.now())}</div>
            `}
            ${anomalyState.windowEnd==null&&html`
              <div className="burn-pill-reset">Window opens on next message</div>
            `}
          </div>
        `}
        ${anomalyToast&&html`
          <div className=${`anomaly-toast sev-${anomalyToast.severity}`}>
            ⚠ Token anomaly: <strong>${anomalyToast.id}</strong>
          </div>
        `}

        <div className="sidebar-toolbar" style=${{flexWrap:'wrap'}}>
          <label className=${`toggle-sm ${remoteApproval?'active':''}`}>
            <input type="checkbox" checked=${remoteApproval} onChange=${toggleRA}/>
            Remote Approval
          </label>
          <label className="toggle-sm">
            <input type="checkbox" checked=${sound} onChange=${e=>setSound(e.target.checked)}/>
            Sound
          </label>
          ${remoteApproval&&html`
            <label className=${`toggle-sm ${autoApprove?'danger':''}`} title=${autoApprove?'⚠ All permissions auto-approved':'Automatically approve all permission requests'}>
              <input type="checkbox" checked=${autoApprove} onChange=${toggleAA}/>
              Auto-Approve
            </label>
          `}
        </div>

        <div className="sidebar-list">
          ${visibleSessions.length===0&&archivedCount===0
            ? html`<div className="sidebar-empty">No sessions yet.<br/>Hooks are active — start using Claude Code.</div>`
            : machineGroups.map(g=>html`
              <div className="machine-group" key=${g.hostname}>
                ${machineGroups.length>1&&html`
                  <div className="machine-header">
                    <div className="machine-dot"></div>
                    <input className="machine-name"
                      value=${g.displayName}
                      title="Click to rename"
                      onBlur=${e=>{const v=e.target.value.trim();if(v&&v!==g.hostname)renameMachine(g.hostname,v);else if(!v)e.target.value=g.displayName}}
                      onKeyDown=${e=>{if(e.key==='Enter')e.target.blur()}}
                    />
                    <span className="machine-count">${g.sessions.length}</span>
                  </div>
                `}
                ${g.sessions.map(s=>html`
                  <${SidebarItem}
                    key=${s.id} s=${s}
                    selected=${s.id===selectedId}
                    approvalCount=${approvalCounts[s.id]||0}
                    onClick=${()=>{setSelectedId(s.id);setMobileDetail(true);setShowSettings(false)}}
                  />
                `)}
              </div>
            `)
          }
          ${archivedCount>0&&!showArchived&&html`
            <div className="sidebar-archived" onClick=${()=>setShowArchived(true)}>
              ${archivedCount} archived session${archivedCount>1?'s':''}
            </div>
          `}
          ${showArchived&&settings.autoArchiveStopped&&html`
            <div className="sidebar-archived" onClick=${()=>setShowArchived(false)}>
              Hide archived
            </div>
          `}
        </div>
      </div>

      <div className="main">
        ${globalPending.length>0 && (!selected || !globalPending.some(a=>a.sessionId===selectedId)) && html`
          <div className="approval-banner">
            <div className="ab-title">Pending Approvals (${globalPending.length})</div>
            <div className="ab-cards">
              ${globalPending.map(a=>html`<${ApprovalCard} key=${a.id} a=${a} onDecide=${decideApproval}/>`)}
            </div>
          </div>
        `}
        ${showSettings
          ?html`<${SettingsPanel}
            settings=${settings}
            sessions=${sessions}
            machineNames=${mNames}
            serverHostname=${serverHost}
            authToken=${authToken}
            updateInfo=${updateInfo}
            uiSkin=${uiSkin}
            setUiSkin=${setUiSkin}
            onClearArchived=${clearStopped}
            theme=${theme}
            setTheme=${setTheme}
          />`
          :html`<${DetailPanel}
            s=${selected}
            approvals=${pending}
            onDecide=${decideApproval}
            onFocus=${focusSession}
            onRemove=${removeSession}
            onRename=${renameSession}
            onBack=${()=>setMobileDetail(false)}
            machineNames=${mNames}
            theme=${theme}
            serverHostname=${serverHost}
            showTokenChart=${settings.showTokenChart!==false}
            showContextBudget=${settings.showContextBudget!==false}
            showSkillAnalytics=${settings.showSkillAnalytics!==false}
          />`
        }
      </div>
    </div>
  `;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
